[package]
name = "ble-radar-desktop"
version = "0.1.0"
description = "BLE radar desktop app"
edition = "2021"

[lib]
name = "ble_radar_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
btleplug = "0.13.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-core-bluetooth = { version = "0.3.2", default-features = false, features = [
    "std", "CBAdvertisementData", "CBAttribute", "CBCentralManager",
    "CBCentralManagerConstants", "CBManager", "CBPeer", "CBPeripheral", "CBUUID",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std", "block2", "NSArray", "NSData", "NSDictionary", "NSEnumerator", "NSError",
    "NSObject", "NSString", "NSUUID", "NSValue",
] }
